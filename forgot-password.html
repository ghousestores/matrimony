<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet" href="navbar.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Forever Matrimony</title>

    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="navbar.css">

</head>
<script>

    const navToggle = document.getElementById("navToggle");
    const navMenu = document.getElementById("navMenu");

    navToggle.addEventListener("click", function () {
        navMenu.classList.toggle("active");
    });

</script>
<body>


<header class="site-header">

    <nav class="navbar">

        <a href="index.html" class="nav-logo">
            Forever Matrimony
        </a>

        <button class="nav-toggle" id="navToggle">
            ☰
        </button>

        <ul class="nav-menu" id="navMenu">

            <li><a href="index.html">Home</a></li>

            <li><a href="profiles.html">Browse Profiles</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="contact.html">Contact</a></li>

            <li><a href="login.html">Login</a></li>

            <li>
                <a href="register.html" class="nav-register">
                    Register
                </a>
            </li>

        </ul>

    </nav>

</header>


<main class="forgot-container">

    <div class="forgot-box">

        <h1>Forgot Password?</h1>

        <p>
            Enter your email address and we'll help you
            reset your password.
        </p>


        <form id="forgotForm">

            <label>Email Address</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >


            <button type="submit">
                Send Reset Link
            </button>

        </form>


        <p id="forgotMessage"></p>


        <a href="login.html" class="back-login">
            ← Back to Login
        </a>

    </div>

</main>


<footer class="site-footer">

    <p>
        © 2026 Forever Matrimony. All Rights Reserved.
    </p>

    <div>

        <a href="index.html">Home</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>

    </div>

</footer>


<script>

const navToggle = document.getElementById("navToggle");
const navMenu = document.getElementById("navMenu");

navToggle.addEventListener("click", function () {

    navMenu.classList.toggle("active");

});


const forgotForm =
    document.getElementById("forgotForm");

const forgotMessage =
    document.getElementById("forgotMessage");

forgotForm.addEventListener("submit", function(event) {

    event.preventDefault();

    forgotMessage.textContent =
        "Password reset functionality will be connected to the backend later.";

});

</script>

</body>
</html>

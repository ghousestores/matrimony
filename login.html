<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="navbar.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Forever Matrimony</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Header -->
    <header class="login-header">
        <a href="index.html" class="logo">Forever Matrimony</a>

        <a href="register.html" class="register-link">
            Create Account
        </a>
    </header>


    <!-- Login Section -->
    <main class="login-container">

        <div class="login-box">

            <div class="login-title">
                <h1>Welcome Back</h1>
                <p>Login to your Forever Matrimony account</p>
            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-button">
                    Login
                </button>

            </form>


            <div id="loginMessage"></div>


            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>


            <!-- Register -->
            <div class="create-account">

                <p>Don't have an account?</p>

                <a href="register.html">
                    Create a New Account
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="login-footer">

        <p>
            © 2026 Forever Matrimony. All Rights Reserved.
        </p>

        <div class="footer-links">

            <a href="index.html">Home</a>

            <a href="terms.html">Terms</a>

            <a href="privacy.html">Privacy</a>

        </div>

    </footer>


    <!-- Demo Login Script -->
    <script>

        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            loginMessage.textContent =
                "Login system will be connected to the backend later.";

            loginMessage.className = "success-message";

        });

    </script>

</body>
</html>
